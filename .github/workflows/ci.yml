name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: Pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mariadb:
        # Misma versión que el servidor de producción (MariaDB 10.11).
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: scl
          MARIADB_USER: scl
          MARIADB_PASSWORD: scl
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: scl
      DB_USERNAME: scl
      DB_PASSWORD: scl

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, gd, zip, pdo_mysql, xml, xmlwriter, bcmath, intl, curl
          coverage: none

      - name: Instalar dependencias de Composer
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Compilar assets
        run: |
          npm ci
          npm run build

      - name: Preparar entorno de pruebas
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Ejecutar la suite
        run: php artisan test --compact

  estilo:
    name: Estilo (Pint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Informativo mientras se aplica Pint a los archivos heredados.
    # Quitar continue-on-error cuando el repositorio esté formateado.
    continue-on-error: true

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Instalar dependencias de Composer
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Comprobar formato
        run: vendor/bin/pint --test --format agent
