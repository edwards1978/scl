# VirtualHost de produccion para SCL (Laravel 12) en http://localhost/scl
#
# Instalar:
#   sudo cp deploy/apache-scl.conf /etc/apache2/sites-available/scl.conf
#   sudo a2enmod rewrite headers alias
#   sudo a2ensite scl.conf
#   sudo a2dissite 000-default.conf
#   sudo apache2ctl configtest
#   sudo systemctl reload apache2
#
# La aplicacion se publica en /scl mediante Alias. El DocumentRoot y el Alias
# apuntan UNICAMENTE a public/. La raiz del proyecto (.env, backups, codigo)
# queda fuera del alcance del servidor web.

<VirtualHost *:80>
    ServerName scl.local
    ServerAlias localhost

    DocumentRoot /var/www/html/scl/public

    # Publicar Laravel en http://localhost/scl
    Alias /scl /var/www/html/scl/public

    <Directory /var/www/html/scl/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Defensa adicional: bloquear archivos ocultos (.env, .git, etc.)
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    # Cabeceras de seguridad basicas
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # La raiz redirige a la aplicacion
    RedirectMatch ^/$ /scl/

    ErrorLog ${APACHE_LOG_DIR}/scl_error.log
    CustomLog ${APACHE_LOG_DIR}/scl_access.log combined
</VirtualHost>
